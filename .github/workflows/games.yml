name: Build game images

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 1 * *"
  push:
    branches:
      - master
    paths:
      - games/**
      - .github/workflows/games.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: games-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish source image
        uses: docker/build-push-action@v6
        with:
          context: ./games/source
          file: ./games/source/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/refoseldev/games:source
            ghcr.io/refoseldev/games:source-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
